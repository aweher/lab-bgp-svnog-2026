! =====================================================================
! as66  -  Cliente de ISP-A (AS66)  -  Origen del secuestro de prefijos
! Arranca anunciando solo su red legitima. El secuestro de 50.0.1.0/24
! (red de AS50) se activa con:  ./lab.sh escenario secuestro on
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as66
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 66.0.0.1/32
 ip address 50.0.1.1/32
!
interface eth1
 description Transito ISP-A (AS10)
 ip address 10.0.8.1/30
!
ip route 66.0.0.0/16 Null0 250
ip route 50.0.1.0/24 Null0 250
!
router bgp 66
 bgp router-id 66.0.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.8.2 remote-as 10
 neighbor 10.0.8.2 description ISP-A
 address-family ipv4 unicast
  network 66.0.0.0/16
  neighbor 10.0.8.2 activate
 exit-address-family
exit
!
end
