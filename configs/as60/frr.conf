! =====================================================================
! as60  -  Cliente multihomed (AS60) de ISP-A e ISP-B
! Temas: slide "BGP soportando solamente IPv4" (configuracion clasica, sin
!        address-family), tabla completa por un proveedor y solo default
!        por el otro, soft-reconfiguration inbound, escenario de route leak
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as60
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
!
interface lo
 ip address 60.0.0.1/32
!
interface eth1
 description Transito ISP-A (AS10): tabla completa
 ip address 10.0.6.1/30
!
interface eth2
 description Transito ISP-B (AS30): solo ruta por defecto
 ip address 10.0.7.1/30
!
ip route 60.0.0.0/16 Null0 250
!
ip prefix-list redes permit 60.0.0.0/16
ip prefix-list sololadefault permit 0.0.0.0/0
ip prefix-list todo permit 0.0.0.0/0 le 32
!
router bgp 60
 bgp router-id 60.0.0.1
 bgp log-neighbor-changes
 network 60.0.0.0/16
 neighbor 10.0.6.2 remote-as 10
 neighbor 10.0.6.2 description ISP-A
 neighbor 10.0.6.2 local-role customer
 neighbor 10.0.6.2 prefix-list todo in
 neighbor 10.0.6.2 prefix-list redes out
 ! Guarda una copia de lo recibido antes de filtrar (show ... received-routes)
 neighbor 10.0.6.2 soft-reconfiguration inbound
 neighbor 10.0.7.2 remote-as 30
 neighbor 10.0.7.2 description ISP-B
 neighbor 10.0.7.2 prefix-list sololadefault in
 neighbor 10.0.7.2 prefix-list redes out
exit
!
end
