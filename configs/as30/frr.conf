! =====================================================================
! as30  -  ISP-B (AS30)  -  Proveedor de transito de AS20 y AS60, miembro del IXP
! Temas: politica de un ISP con large communities, RPKI en todas las
!        entradas, vecinos dinamicos (listen range), default-originate
!        (tabla parcial), MED, sesiones IPv4 que transportan IPv4 e IPv6
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as30
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 30.0.0.1/32
 ipv6 address 2001:db8:30::1/128
!
interface eth1
 description Cliente EmpresaA (AS20)
 ip address 10.0.2.2/30
 ipv6 address 2001:db8:0:2::2/64
!
interface eth2
 description Transito Internet (AS40)
 ip address 10.0.4.1/30
 ipv6 address 2001:db8:0:4::1/64
!
interface eth3
 description Clientes dinamicos (AS60)
 ip address 10.0.7.2/30
!
interface eth4
 description LAN del IXP (AS100)
 ip address 192.168.0.30/24
 ipv6 address 2001:db8:100::30/64
!
ip route 30.0.0.0/16 Null0 250
ipv6 route 2001:db8:30::/48 Null0 250
!
rpki
 ! Reintento rapido: el validador puede tardar unos segundos en estar listo
 rpki retry_interval 10
 rpki polling_period 60
 rpki cache tcp 172.31.255.250 3323 preference 1
exit
!
! ---------------- Filtros ----------------
ip prefix-list propias permit 30.0.0.0/16
ipv6 prefix-list propias6 permit 2001:db8:30::/48
ip prefix-list cliente-as20 permit 20.0.0.0/21 le 24
ipv6 prefix-list cliente-as20-v6 permit 2001:db8:20::/48
ip prefix-list sololadefault permit 0.0.0.0/0
!
! Tabla de large communities de AS30 (ASN:funcion:parametro)
!   30:1:100  aprendida de un cliente      (local-preference 200)
!   30:1:200  aprendida en el IXP          (local-preference 150)
!   30:1:300  aprendida de un proveedor    (local-preference 100)
bgp large-community-list standard CLIENTES permit 30:1:100
!
route-map de-as20 deny 10
 match rpki invalid
route-map de-as20 permit 20
 match ip address prefix-list cliente-as20
 set local-preference 200
 set large-community 30:1:100 additive
route-map de-as20 permit 30
 match ipv6 address prefix-list cliente-as20-v6
 set local-preference 200
 set large-community 30:1:100 additive
!
route-map de-clientes-din deny 10
 match rpki invalid
route-map de-clientes-din permit 20
 set local-preference 200
 set large-community 30:1:100 additive
!
route-map de-ixp deny 10
 match rpki invalid
route-map de-ixp permit 20
 set local-preference 150
 set large-community 30:1:200 additive
!
route-map de-proveedor deny 10
 match rpki invalid
route-map de-proveedor permit 20
 set local-preference 100
 set large-community 30:1:300 additive
!
! A proveedores y al IXP: solo redes propias y de clientes
route-map a-externos permit 10
 match large-community CLIENTES
route-map a-externos permit 20
 match ip address prefix-list propias
route-map a-externos permit 30
 match ipv6 address prefix-list propias6
!
! A EmpresaA: tabla completa, con MED
route-map a-as20 permit 10
 set metric 30
!
router bgp 30
 bgp router-id 30.0.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp enforce-first-as
 !
 neighbor 10.0.2.1 remote-as 20
 neighbor 10.0.2.1 description Cliente EmpresaA (IPv4 e IPv6 sobre IPv4)
 neighbor 10.0.2.1 password sup3rs3cr3t0
 neighbor 10.0.2.1 local-role provider strict-mode
 !
 neighbor 10.0.4.2 remote-as 40
 neighbor 10.0.4.2 description Transito Internet (IPv4 e IPv6 sobre IPv4)
 neighbor 10.0.4.2 local-role customer
 !
 ! Vecinos dinamicos: se acepta cualquier vecino eBGP del rango, sin declararlo
 neighbor CLIENTES-DIN peer-group
 neighbor CLIENTES-DIN remote-as external
 neighbor CLIENTES-DIN description Clientes por rango (vecinos dinamicos)
 bgp listen range 10.0.7.0/30 peer-group CLIENTES-DIN
 bgp listen limit 5
 !
 neighbor 192.168.0.1 remote-as 100
 neighbor 192.168.0.1 description IXP RS (IPv4 e IPv6 sobre IPv4)
 neighbor 192.168.0.1 password ixp-s3cr3t0
 ! El RS usa ttl-security (GTSM): el miembro tambien debe enviar TTL 255
 neighbor 192.168.0.1 ttl-security hops 1
 ! Reintento de conexion rapido (por defecto son 120 segundos)
 neighbor 192.168.0.1 timers connect 10
 neighbor 192.168.0.1 local-role rs-client
 !
 address-family ipv4 unicast
  network 30.0.0.0/16
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-map de-as20 in
  neighbor 10.0.2.1 route-map a-as20 out
  neighbor 10.0.2.1 maximum-prefix 20
  neighbor 10.0.4.2 activate
  neighbor 10.0.4.2 route-map de-proveedor in
  neighbor 10.0.4.2 route-map a-externos out
  neighbor CLIENTES-DIN activate
  neighbor CLIENTES-DIN route-map de-clientes-din in
  ! Tabla parcial: al cliente se le envia unicamente la ruta por defecto
  neighbor CLIENTES-DIN default-originate
  neighbor CLIENTES-DIN prefix-list sololadefault out
  neighbor CLIENTES-DIN maximum-prefix 20
  neighbor 192.168.0.1 activate
  neighbor 192.168.0.1 route-map de-ixp in
  neighbor 192.168.0.1 route-map a-externos out
  neighbor 192.168.0.1 maximum-prefix 100
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:30::/48
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-map de-as20 in
  neighbor 10.0.2.1 route-map a-as20 out
  neighbor 10.0.4.2 activate
  neighbor 10.0.4.2 route-map de-proveedor in
  neighbor 10.0.4.2 route-map a-externos out
  neighbor 192.168.0.1 activate
  neighbor 192.168.0.1 route-map de-ixp in
  neighbor 192.168.0.1 route-map a-externos out
 exit-address-family
exit
!
end
