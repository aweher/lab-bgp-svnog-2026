! =====================================================================
! as41  -  Red remota (AS41)  -  Cliente de AS40
! Temas: BGP sin numerar, IPv4 con next-hop IPv6 (RFC 8950).
!        Sus prefijos NO tienen ROA: en RPKI figuran como "not found".
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as41
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 41.0.0.1/32
 ipv6 address 2001:db8:41::1/128
!
interface eth1
 description Transito AS40: enlace sin direcciones, solo link-local IPv6
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
!
ip route 41.0.0.0/16 Null0 250
ipv6 route 2001:db8:41::/48 Null0 250
!
ip prefix-list redes permit 41.0.0.0/16
ipv6 prefix-list redesv6 permit 2001:db8:41::/48
route-map todo permit 10
!
router bgp 41
 bgp router-id 41.0.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 40
 neighbor eth1 description Transito AS40 (sin numerar)
 neighbor eth1 local-role customer
 !
 address-family ipv4 unicast
  network 41.0.0.0/16
  neighbor eth1 activate
  neighbor eth1 route-map todo in
  neighbor eth1 prefix-list redes out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:41::/48
  neighbor eth1 activate
  neighbor eth1 route-map todo in
  neighbor eth1 prefix-list redesv6 out
 exit-address-family
exit
!
end
