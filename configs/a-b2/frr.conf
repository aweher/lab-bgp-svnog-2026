! =====================================================================
! a-b2  -  AS20 "EmpresaA"  -  Borde hacia ISP-B (AS30) y hacia el IXP
! Temas: sesion unica IPv4 con las dos familias, redistribucion de OSPF,
!        politica multihomed (slide "ISP-B"), miembro de IXP (slide "IXP"),
!        AS-PATH ACL, comunidades, RPKI, roles
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname a-b2
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 20.0.3.3/32
 ipv6 address 2001:db8:20::3/128
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
interface eth1
 description Hacia ISP-B (AS30)
 ip address 10.0.2.1/30
 ipv6 address 2001:db8:0:2::1/64
!
interface eth2
 description LAN del IXP (AS100)
 ip address 192.168.0.20/24
 ipv6 address 2001:db8:100::20/64
!
interface eth3
 description Hacia a-rr
 ip address 20.0.3.14/30
 ipv6 address 2001:db8:20:f002::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth4
 description Hacia a-b1
 ip address 20.0.3.18/30
 ipv6 address 2001:db8:20:f003::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
ip route 20.0.0.0/21 Null0 250
ip route 20.0.0.0/22 Null0 250
ip route 20.0.4.0/22 Null0 250
ipv6 route 2001:db8:20::/48 Null0 250
!
router ospf
 ospf router-id 20.0.3.3
!
router ospf6
 ospf6 router-id 20.0.3.3
!
rpki
 ! Reintento rapido: el validador puede tardar unos segundos en estar listo
 rpki retry_interval 10
 rpki polling_period 60
 rpki cache tcp 172.31.255.250 3323 preference 1
exit
!
! ---------------- Filtros ----------------
ip prefix-list misredes permit 20.0.0.0/21
ip prefix-list noadvertise permit 20.0.0.0/21 ge 22 le 24
ipv6 prefix-list redesv6 permit 2001:db8:20::/48
!
! Prefijos que nunca se aceptan en el IXP
ip prefix-list no-aceptar permit 10.0.0.0/8 le 32
ip prefix-list no-aceptar permit 172.16.0.0/12 le 32
ip prefix-list no-aceptar permit 192.168.0.0/16 le 32
ip prefix-list no-aceptar permit 0.0.0.0/0
!
! Redistribucion: solo este prefijo pasa de OSPF a BGP
ip prefix-list advertise-v4 seq 5 permit 20.0.4.0/22
route-map ospf-redist permit 10
 match ip address prefix-list advertise-v4
!
bgp as-path access-list 10 permit _10_
bgp as-path access-list 30 permit _30_
bgp as-path access-list 3 permit _30$
!
! Salida hacia AS30
route-map as30-out permit 100
 match ip address prefix-list noadvertise
 set community no-advertise
route-map as30-out permit 500
 match ip address prefix-list misredes
 set as-path prepend 20
route-map as30-out permit 600
 description IPv6 por la misma sesion
 match ipv6 address prefix-list redesv6
!
! Entrada desde AS30
route-map as30-in deny 10
 match rpki invalid
route-map as30-in permit 100
 match as-path 10
 set local-preference 90
 on-match goto 1000
route-map as30-in permit 500
 match as-path 30
 set local-preference 150
 on-match goto 1000
route-map as30-in permit 1000
 set community 20:30 additive
!
! Salida hacia el IXP: solo el agregado
route-map ixp-out permit 100
 match ip address prefix-list misredes
route-map ixp-out6 permit 100
 match ipv6 address prefix-list redesv6
!
! Entrada desde el IXP
route-map ixp-in deny 10
 match rpki invalid
route-map ixp-in deny 20
 match ip address prefix-list no-aceptar
route-map ixp-in deny 30
 description Las redes de AS30 se prefieren por el enlace de transito
 match as-path 3
route-map ixp-in permit 100
 set community 20:100 additive
 set local-preference 200
!
router bgp 20
 bgp router-id 20.0.3.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp fast-external-failover
 ! El route server no agrega su ASN: el primer AS del camino no es el del vecino
 no bgp enforce-first-as
 !
 neighbor 20.0.3.1 remote-as 20
 neighbor 20.0.3.1 description a-rr (route reflector)
 neighbor 20.0.3.1 update-source lo
 !
 ! eBGP hacia ISP-B: una sola sesion IPv4 que transporta IPv4 e IPv6
 neighbor 10.0.2.2 remote-as 30
 neighbor 10.0.2.2 description ISP-B
 neighbor 10.0.2.2 password sup3rs3cr3t0
 neighbor 10.0.2.2 local-role customer strict-mode
 !
 ! Route server del IXP: doble peer
 neighbor 192.168.0.1 remote-as 100
 neighbor 192.168.0.1 description IXP RS IPv4
 neighbor 192.168.0.1 password ixp-s3cr3t0
 ! El RS usa ttl-security (GTSM): el miembro tambien debe enviar TTL 255
 neighbor 192.168.0.1 ttl-security hops 1
 ! Reintento de conexion rapido (por defecto son 120 segundos)
 neighbor 192.168.0.1 timers connect 10
 neighbor 192.168.0.1 local-role rs-client
 neighbor 2001:db8:100::1 remote-as 100
 neighbor 2001:db8:100::1 description IXP RS IPv6
 neighbor 2001:db8:100::1 password ixp-s3cr3t0
 ! El RS usa ttl-security (GTSM): el miembro tambien debe enviar TTL 255
 neighbor 2001:db8:100::1 ttl-security hops 1
 ! Reintento de conexion rapido (por defecto son 120 segundos)
 neighbor 2001:db8:100::1 timers connect 10
 neighbor 2001:db8:100::1 local-role rs-client
 !
 address-family ipv4 unicast
  network 20.0.0.0/21
  network 20.0.0.0/22
  ! El segundo /22 se origina por redistribucion (ORIGIN = incomplete)
  redistribute ospf route-map ospf-redist
  neighbor 20.0.3.1 activate
  neighbor 20.0.3.1 next-hop-self
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 route-map as30-in in
  neighbor 10.0.2.2 route-map as30-out out
  neighbor 10.0.2.2 maximum-prefix 1000
  neighbor 192.168.0.1 activate
  neighbor 192.168.0.1 route-map ixp-in in
  neighbor 192.168.0.1 route-map ixp-out out
  neighbor 192.168.0.1 maximum-prefix 100
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:20::/48
  neighbor 20.0.3.1 activate
  neighbor 20.0.3.1 next-hop-self
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 route-map as30-in in
  neighbor 10.0.2.2 route-map as30-out out
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:100::1 route-map ixp-in in
  neighbor 2001:db8:100::1 route-map ixp-out6 out
  neighbor 2001:db8:100::1 maximum-prefix 100
 exit-address-family
exit
!
end
