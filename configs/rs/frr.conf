! =====================================================================
! rs  -  Route server del IXP (AS100)
! Temas: slides "IXP basico" e "IXP con Peer Groups": route-server-client,
!        attribute-unchanged next-hop, sesiones pasivas, ttl-security,
!        maximum-prefix, RPKI en el route server, rol rs-server
! El RS no reenvia trafico: solo reparte rutas entre los miembros.
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname rs
log file /tmp/frr.log informational
service integrated-vtysh-config
!
interface eth1
 description LAN del IXP
 ip address 192.168.0.1/24
 ipv6 address 2001:db8:100::1/64
!
rpki
 ! Reintento rapido: el validador puede tardar unos segundos en estar listo
 rpki retry_interval 10
 rpki polling_period 60
 rpki cache tcp 172.31.255.250 3323 preference 1
exit
!
! Filtro de entrada comun a todos los miembros
ip prefix-list bogons permit 0.0.0.0/0
ip prefix-list bogons permit 10.0.0.0/8 le 32
ip prefix-list bogons permit 172.16.0.0/12 le 32
ip prefix-list bogons permit 192.168.0.0/16 le 32
ip prefix-list bogons permit 0.0.0.0/0 ge 25
!
route-map miembros-in deny 10
 match rpki invalid
route-map miembros-in deny 20
 match ip address prefix-list bogons
route-map miembros-in permit 100
!
route-map miembros-out permit 100
!
router bgp 100
 bgp router-id 192.168.0.1
 bgp log-neighbor-changes
 no bgp fast-external-failover
 no bgp default ipv4-unicast
 bgp graceful-restart
 !
 ! Crear el peer group y poner los ASN de los miembros
 neighbor MiembrosDelIXP peer-group
 neighbor MiembrosDelIXP description Miembros
 neighbor MiembrosDelIXP password ixp-s3cr3t0
 neighbor MiembrosDelIXP passive
 neighbor MiembrosDelIXP ttl-security hops 1
 neighbor MiembrosDelIXP local-role rs-server
 !
 ! AS20: una sesion por familia
 neighbor 192.168.0.20 remote-as 20
 neighbor 192.168.0.20 peer-group MiembrosDelIXP
 neighbor 2001:db8:100::20 remote-as 20
 neighbor 2001:db8:100::20 peer-group MiembrosDelIXP
 ! AS30: una sesion IPv4 para las dos familias
 neighbor 192.168.0.30 remote-as 30
 neighbor 192.168.0.30 peer-group MiembrosDelIXP
 ! AS50: una sesion IPv6 para las dos familias
 neighbor 2001:db8:100::50 remote-as 50
 neighbor 2001:db8:100::50 peer-group MiembrosDelIXP
 !
 address-family ipv4 unicast
  neighbor MiembrosDelIXP remove-private-AS
  neighbor MiembrosDelIXP attribute-unchanged next-hop
  neighbor MiembrosDelIXP route-server-client
  neighbor MiembrosDelIXP send-community both
  neighbor MiembrosDelIXP maximum-prefix 100
  neighbor MiembrosDelIXP route-map miembros-in in
  neighbor MiembrosDelIXP route-map miembros-out out
  neighbor 192.168.0.20 activate
  neighbor 192.168.0.30 activate
  neighbor 2001:db8:100::50 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor MiembrosDelIXP remove-private-AS
  neighbor MiembrosDelIXP attribute-unchanged next-hop
  neighbor MiembrosDelIXP route-server-client
  neighbor MiembrosDelIXP send-community both
  neighbor MiembrosDelIXP maximum-prefix 100
  neighbor MiembrosDelIXP route-map miembros-in in
  neighbor MiembrosDelIXP route-map miembros-out out
  neighbor 2001:db8:100::20 activate
  neighbor 192.168.0.30 activate
  neighbor 2001:db8:100::50 activate
 exit-address-family
exit
!
end
