! =====================================================================
! a-b1  -  AS20 "EmpresaA"  -  Borde hacia ISP-A (AS10)
! Temas: eBGP con doble peer (IPv4 e IPv6), autenticacion, BFD, roles,
!        politica multihomed (slide "ASN Multi Homed: ISP-A"), RTBH,
!        RPKI contra FORT, FlowSpec (lado cliente), rutas "naileadas"
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname a-b1
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 20.0.3.2/32
 ipv6 address 2001:db8:20::2/128
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
interface eth1
 description Hacia ISP-A (AS10)
 ip address 10.0.1.1/30
 ipv6 address 2001:db8:0:1::1/64
!
interface eth2
 description Hacia a-rr
 ip address 20.0.3.10/30
 ipv6 address 2001:db8:20:f001::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description Hacia a-b2
 ip address 20.0.3.17/30
 ipv6 address 2001:db8:20:f003::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth4
 description Hacia el controlador de mitigacion (FlowSpec)
 ip address 20.0.3.21/30
 ip ospf area 0
 ip ospf passive
!
! Rutas "naileadas": descarte con distancia 250 para poder originar los prefijos
ip route 20.0.0.0/21 Null0 250
ip route 20.0.0.0/22 Null0 250
ip route 20.0.4.0/22 Null0 250
ipv6 route 2001:db8:20::/48 Null0 250
!
router ospf
 ospf router-id 20.0.3.2
!
router ospf6
 ospf6 router-id 20.0.3.2
!
! ---------------- RPKI: sesion RTR contra el validador FORT ----------------
rpki
 ! Reintento rapido: el validador puede tardar unos segundos en estar listo
 rpki retry_interval 10
 rpki polling_period 60
 rpki cache tcp 172.31.255.250 3323 preference 1
exit
!
! ---------------- Filtros ----------------
ip prefix-list misredes permit 20.0.0.0/21
ip prefix-list noadvertise permit 20.0.0.0/21 ge 22 le 24
ip prefix-list victima permit 20.0.1.1/32
ipv6 prefix-list redesv6 permit 2001:db8:20::/48
!
bgp as-path access-list 10 permit _10_
bgp as-path access-list 30 permit _30_
!
! Salida hacia AS10
route-map as10-out permit 50
 description RTBH: la IP atacada sale con la comunidad blackhole
 match ip address prefix-list victima
 set community 65535:666 no-export
route-map as10-out permit 100
 description Los /22 llegan a AS10 pero no se propagan mas alla
 match ip address prefix-list noadvertise
 set community no-advertise
route-map as10-out permit 500
 match ip address prefix-list misredes
 set as-path prepend 20
!
! Entrada desde AS10
route-map as10-in deny 10
 description Validacion de origen: se descartan las invalidas
 match rpki invalid
route-map as10-in permit 100
 match as-path 30
 set local-preference 90
 on-match goto 1000
route-map as10-in permit 500
 match as-path 10
 set local-preference 150
 on-match goto 1000
route-map as10-in permit 1000
 set community 20:10 additive
!
route-map as10-in6 deny 10
 match rpki invalid
route-map as10-in6 permit 100
 set local-preference 150
 set community 20:10 additive
!
router bgp 20
 bgp router-id 20.0.3.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp fast-external-failover
 !
 ! iBGP hacia el route reflector, desde la loopback
 neighbor 20.0.3.1 remote-as 20
 neighbor 20.0.3.1 description a-rr (route reflector)
 neighbor 20.0.3.1 update-source lo
 !
 ! eBGP hacia ISP-A: una sesion por familia ("doble peer")
 neighbor 10.0.1.2 remote-as 10
 neighbor 10.0.1.2 description ISP-A IPv4
 neighbor 10.0.1.2 password sup3rs3cr3t0
 neighbor 10.0.1.2 bfd
 neighbor 10.0.1.2 local-role customer strict-mode
 neighbor 2001:db8:0:1::2 remote-as 10
 neighbor 2001:db8:0:1::2 description ISP-A IPv6
 neighbor 2001:db8:0:1::2 password sup3rs3cr3t0
 neighbor 2001:db8:0:1::2 local-role customer strict-mode
 !
 ! iBGP hacia el controlador de mitigacion (solo FlowSpec)
 neighbor 20.0.3.22 remote-as 20
 neighbor 20.0.3.22 description Controlador de mitigacion
 !
 address-family ipv4 unicast
  network 20.0.0.0/21
  network 20.0.0.0/22
  network 20.0.4.0/22
  neighbor 20.0.3.1 activate
  neighbor 20.0.3.1 next-hop-self
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 route-map as10-in in
  neighbor 10.0.1.2 route-map as10-out out
  neighbor 10.0.1.2 maximum-prefix 1000
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:20::/48
  neighbor 20.0.3.1 activate
  neighbor 20.0.3.1 next-hop-self
  neighbor 2001:db8:0:1::2 activate
  neighbor 2001:db8:0:1::2 route-map as10-in6 in
  neighbor 2001:db8:0:1::2 prefix-list redesv6 out
  neighbor 2001:db8:0:1::2 maximum-prefix 1000
 exit-address-family
 !
 address-family ipv4 flowspec
  neighbor 20.0.3.22 activate
  ! Interfaz donde se aplican las reglas recibidas
  local-install eth1
 exit-address-family
exit
!
end
