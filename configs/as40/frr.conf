! =====================================================================
! as40  -  "Internet" (AS40)  -  Transito de AS10, AS30, AS41 y AS50
! Temas: configuracion minima al estilo del slide "Configuracion basica de
!        eBGP" (sin politicas), multipath entre proveedores distintos,
!        BGP sin numerar con next-hop IPv6 para rutas IPv4 (RFC 8950)
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as40
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 40.0.0.1/32
 ipv6 address 2001:db8:40::1/128
!
interface eth1
 description Cliente ISP-A (AS10)
 ip address 10.0.3.2/30
 ipv6 address 2001:db8:0:3::2/64
!
interface eth2
 description Cliente ISP-B (AS30)
 ip address 10.0.4.2/30
 ipv6 address 2001:db8:0:4::2/64
!
interface eth3
 description Cliente AS41: enlace sin direcciones, solo link-local IPv6
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
!
interface eth4
 description Cliente AS50 (contenido)
 ip address 10.0.5.2/30
 ipv6 address 2001:db8:0:5::2/64
!
ip route 40.0.0.0/16 Null0 250
ipv6 route 2001:db8:40::/48 Null0 250
!
router bgp 40
 bgp router-id 40.0.0.1
 bgp log-neighbor-changes
 ! RFC 8212: sin esta linea, una sesion eBGP sin politica no acepta ni anuncia nada
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 ! Permite repartir trafico entre caminos con AS-PATH distinto pero del mismo largo
 bgp bestpath as-path multipath-relax
 !
 neighbor 2001:db8:0:3::1 remote-as 10
 neighbor 2001:db8:0:3::1 description ISP-A
 neighbor 2001:db8:0:3::1 local-role provider
 neighbor 10.0.4.1 remote-as 30
 neighbor 10.0.4.1 description ISP-B
 neighbor 10.0.4.1 local-role provider
 neighbor 10.0.5.1 remote-as 50
 neighbor 10.0.5.1 description AS50 (contenido)
 neighbor 10.0.5.1 local-role provider
 ! Vecino por interfaz: no hace falta ninguna IP en el enlace
 neighbor eth3 interface remote-as 41
 neighbor eth3 description AS41 (sin numerar)
 neighbor eth3 local-role provider
 !
 address-family ipv4 unicast
  network 40.0.0.0/16
  maximum-paths 2
  neighbor 2001:db8:0:3::1 activate
  neighbor 10.0.4.1 activate
  neighbor 10.0.5.1 activate
  neighbor eth3 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:40::/48
  maximum-paths 2
  neighbor 2001:db8:0:3::1 activate
  neighbor 10.0.4.1 activate
  neighbor 10.0.5.1 activate
  neighbor eth3 activate
 exit-address-family
exit
!
end
