! =====================================================================
! as10  -  ISP-A (AS10)  -  Proveedor de transito de AS20, AS60 y AS66
! Temas: politica de un ISP con comunidades clasicas, local-preference por
!        tipo de vecino, aceptacion de RTBH, maximum-prefix, BFD, dampening,
!        roles, sesion unica IPv6 que transporta IPv4 e IPv6 (hacia AS40)
! OJO:   este ISP no valida RPKI y NO filtra a su cliente AS66. Es a
!        proposito: asi se puede ver hasta donde llega un secuestro.
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as10
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 110.0.0.1/32
 ipv6 address 2001:db8:10::1/128
!
interface eth1
 description Cliente EmpresaA (AS20)
 ip address 10.0.1.2/30
 ipv6 address 2001:db8:0:1::2/64
!
interface eth2
 description Transito Internet (AS40)
 ip address 10.0.3.1/30
 ipv6 address 2001:db8:0:3::1/64
!
interface eth3
 description Cliente AS60
 ip address 10.0.6.2/30
!
interface eth4
 description Cliente AS66
 ip address 10.0.8.2/30
!
ip route 110.0.0.0/16 Null0 250
ipv6 route 2001:db8:10::/48 Null0 250
! Next-hop de descarte para el blackhole (RTBH)
ip route 192.0.2.1/32 Null0
!
! ---------------- Filtros ----------------
ip prefix-list propias permit 110.0.0.0/16
ipv6 prefix-list propias6 permit 2001:db8:10::/48
ip prefix-list cliente-as20 permit 20.0.0.0/21 le 24
ip prefix-list cliente-as20-host permit 20.0.0.0/21 ge 32
ipv6 prefix-list cliente-as20-v6 permit 2001:db8:20::/48
ip prefix-list cliente-as60 permit 60.0.0.0/16 le 24
!
! Tabla de comunidades de AS10
!   10:100  aprendida de un cliente      (local-preference 200)
!   10:300  aprendida de un proveedor    (local-preference 100)
!   65535:666  blackhole (RFC 7999): solo se acepta de clientes y para sus /32
bgp community-list standard CLIENTES permit 10:100
bgp community-list standard BLACKHOLE permit blackhole
!
route-map de-as20 permit 10
 description RTBH: /32 del cliente con la comunidad blackhole
 match community BLACKHOLE
 match ip address prefix-list cliente-as20-host
 set ip next-hop 192.0.2.1
 set local-preference 200
 set community 10:100 no-export additive
route-map de-as20 permit 20
 match ip address prefix-list cliente-as20
 set local-preference 200
 set community 10:100 additive
!
route-map de-as20-v6 permit 10
 match ipv6 address prefix-list cliente-as20-v6
 set local-preference 200
 set community 10:100 additive
!
route-map de-as60 permit 10
 match ip address prefix-list cliente-as60
 set local-preference 200
 set community 10:100 additive
!
route-map de-as66 permit 10
 description MALA PRACTICA: se acepta cualquier cosa de este cliente
 set local-preference 200
 set community 10:100 additive
!
route-map de-proveedor permit 10
 set local-preference 100
 set community 10:300 additive
!
! A proveedores: solo redes propias y de clientes
route-map a-proveedor permit 10
 match community CLIENTES
route-map a-proveedor permit 20
 match ip address prefix-list propias
route-map a-proveedor permit 30
 match ipv6 address prefix-list propias6
!
! A clientes: tabla completa
route-map a-clientes permit 10
!
router bgp 10
 bgp router-id 110.0.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor 10.0.1.1 remote-as 20
 neighbor 10.0.1.1 description Cliente EmpresaA IPv4
 neighbor 10.0.1.1 password sup3rs3cr3t0
 neighbor 10.0.1.1 bfd
 ! Permite que el next-hop de descarte del RTBH (192.0.2.1) se resuelva por la ruta estatica
 neighbor 10.0.1.1 disable-connected-check
 neighbor 10.0.1.1 local-role provider strict-mode
 neighbor 2001:db8:0:1::1 remote-as 20
 neighbor 2001:db8:0:1::1 description Cliente EmpresaA IPv6
 neighbor 2001:db8:0:1::1 password sup3rs3cr3t0
 neighbor 2001:db8:0:1::1 local-role provider strict-mode
 !
 ! Una sola sesion sobre IPv6 que transporta las dos familias
 neighbor 2001:db8:0:3::2 remote-as 40
 neighbor 2001:db8:0:3::2 description Transito Internet (IPv4 e IPv6 sobre IPv6)
 neighbor 2001:db8:0:3::2 local-role customer
 !
 neighbor 10.0.6.1 remote-as 60
 neighbor 10.0.6.1 description Cliente AS60
 neighbor 10.0.6.1 local-role provider
 !
 neighbor 10.0.8.1 remote-as 66
 neighbor 10.0.8.1 description Cliente AS66
 !
 address-family ipv4 unicast
  network 110.0.0.0/16
  ! Dampening (RFC 2439) con los valores por defecto de FRR
  bgp dampening
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 route-map de-as20 in
  neighbor 10.0.1.1 route-map a-clientes out
  neighbor 10.0.1.1 maximum-prefix 20
  neighbor 2001:db8:0:3::2 activate
  neighbor 2001:db8:0:3::2 route-map de-proveedor in
  neighbor 2001:db8:0:3::2 route-map a-proveedor out
  neighbor 10.0.6.1 activate
  neighbor 10.0.6.1 route-map de-as60 in
  neighbor 10.0.6.1 route-map a-clientes out
  neighbor 10.0.6.1 maximum-prefix 20
  neighbor 10.0.8.1 activate
  neighbor 10.0.8.1 route-map de-as66 in
  neighbor 10.0.8.1 route-map a-clientes out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:10::/48
  neighbor 2001:db8:0:1::1 activate
  neighbor 2001:db8:0:1::1 route-map de-as20-v6 in
  neighbor 2001:db8:0:1::1 route-map a-clientes out
  neighbor 2001:db8:0:1::1 maximum-prefix 20
  neighbor 2001:db8:0:3::2 activate
  neighbor 2001:db8:0:3::2 route-map de-proveedor in
  neighbor 2001:db8:0:3::2 route-map a-proveedor out
 exit-address-family
exit
!
end
