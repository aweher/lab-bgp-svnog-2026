# Controlador de mitigacion: origina una regla FlowSpec hacia el borde de AS20.
# Regla: descartar UDP con puerto de origen 123 (NTP) hacia la IP atacada 20.0.1.1
neighbor 20.0.3.21 {
    description "a-b1 (borde de AS20)";
    router-id 20.0.3.22;
    local-address 20.0.3.22;
    local-as 20;
    peer-as 20;
    family {
        ipv4 flow;
    }
    flow {
        route ataque-ntp {
            match {
                destination 20.0.1.1/32;
                protocol udp;
                source-port =123;
            }
            then {
                discard;
            }
        }
    }
}
