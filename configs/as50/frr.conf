! =====================================================================
! as50  -  Red de contenido (AS50)  -  Transito por AS40 y peering en el IXP
! Temas: slide "BGP multifamilia sobre IPv6" (una sesion IPv6 para IPv4 e
!        IPv6), filter-list con AS-PATH ACL y expresiones regulares,
!        preferencia del IXP sobre el transito, rol rs-client
! Es la victima del secuestro de prefijos que origina AS66.
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname as50
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 50.0.0.1/32
 ip address 50.0.1.1/32
 ipv6 address 2001:db8:50::1/128
!
interface eth1
 description LAN del IXP (AS100)
 ip address 192.168.0.50/24
 ipv6 address 2001:db8:100::50/64
!
interface eth2
 description Transito Internet (AS40)
 ip address 10.0.5.1/30
 ipv6 address 2001:db8:0:5::1/64
!
ip route 50.0.0.0/16 Null0 250
ipv6 route 2001:db8:50::/48 Null0 250
!
ip prefix-list redes permit 50.0.0.0/16
ipv6 prefix-list redesv6 permit 2001:db8:50::/48
!
! ACL 1: descarta caminos que contengan un ASN privado (64500 a 65999) y
!        permite el resto. Usa alternativas, rangos y comodin.
! ACL 2: solo rutas locales (AS-PATH vacio).
bgp as-path access-list 1 deny _6(4[5-9]|5[0-9])[0-9][0-9]_
bgp as-path access-list 1 permit .*
bgp as-path access-list 2 permit ^$
!
route-map ixp-in permit 10
 description Lo aprendido en el IXP se prefiere sobre el transito
 match as-path 1
 set local-preference 200
route-map transito-in permit 10
 match as-path 1
!
router bgp 50
 bgp router-id 50.0.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp enforce-first-as
 neighbor 2001:db8:100::1 remote-as 100
 neighbor 2001:db8:100::1 description IXP BGP Multi-AF RS
 neighbor 2001:db8:100::1 password ixp-s3cr3t0
 ! El RS usa ttl-security (GTSM): el miembro tambien debe enviar TTL 255
 neighbor 2001:db8:100::1 ttl-security hops 1
 ! Reintento de conexion rapido (por defecto son 120 segundos)
 neighbor 2001:db8:100::1 timers connect 10
 neighbor 2001:db8:100::1 local-role rs-client
 neighbor 10.0.5.2 remote-as 40
 neighbor 10.0.5.2 description Transito Internet (IPv4 e IPv6 sobre IPv4)
 neighbor 10.0.5.2 local-role customer
 !
 address-family ipv4 unicast
  network 50.0.0.0/16
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:100::1 prefix-list redes out
  neighbor 2001:db8:100::1 route-map ixp-in in
  neighbor 2001:db8:100::1 filter-list 2 out
  neighbor 10.0.5.2 activate
  neighbor 10.0.5.2 prefix-list redes out
  neighbor 10.0.5.2 route-map transito-in in
  neighbor 10.0.5.2 filter-list 2 out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:50::/48
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:100::1 prefix-list redesv6 out
  neighbor 2001:db8:100::1 route-map ixp-in in
  neighbor 2001:db8:100::1 filter-list 2 out
  neighbor 10.0.5.2 activate
  neighbor 10.0.5.2 prefix-list redesv6 out
  neighbor 10.0.5.2 route-map transito-in in
  neighbor 10.0.5.2 filter-list 2 out
 exit-address-family
exit
!
end
