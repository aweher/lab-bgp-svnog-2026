! =====================================================================
! a-rr  -  AS20 "EmpresaA"  -  Route Reflector y red de clientes
! Temas: OSPF como IGP, iBGP desde loopback, route reflector, cluster-id,
!        peer groups, update groups, multipath iBGP
! =====================================================================
frr version 10.7.1
frr defaults traditional
hostname a-rr
log file /tmp/frr.log informational
service integrated-vtysh-config
ip forwarding
ipv6 forwarding
!
interface lo
 description Loopback de iBGP y direcciones de servicio
 ip address 20.0.3.1/32
 ip address 20.0.0.1/32
 ip address 20.0.1.1/32
 ip address 20.0.4.1/32
 ipv6 address 2001:db8:20::1/128
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
interface eth1
 description Hacia a-b1
 ip address 20.0.3.9/30
 ipv6 address 2001:db8:20:f001::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 description Hacia a-b2
 ip address 20.0.3.13/30
 ipv6 address 2001:db8:20:f002::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
! Red de clientes de EmpresaA: los bordes la conocen por el IGP
ip route 20.0.4.0/22 Null0
!
router ospf
 ospf router-id 20.0.3.1
 redistribute static
!
router ospf6
 ospf6 router-id 20.0.3.1
!
router bgp 20
 bgp router-id 20.0.3.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 ! Por defecto el cluster-id es el router-id; aca queda explicito
 bgp cluster-id 20.0.3.1
 ! Necesario para repartir entre caminos que salen por proveedores distintos
 bgp bestpath as-path multipath-relax
 !
 ! Peer group: una sola definicion para todos los clientes del RR
 neighbor iBGP-PG peer-group
 neighbor iBGP-PG remote-as 20
 neighbor iBGP-PG description Clientes del route reflector
 neighbor iBGP-PG update-source lo
 neighbor 20.0.3.2 peer-group iBGP-PG
 neighbor 20.0.3.3 peer-group iBGP-PG
 !
 address-family ipv4 unicast
  neighbor iBGP-PG activate
  neighbor iBGP-PG route-reflector-client
  ! Instala los dos caminos iBGP equivalentes (uno por cada borde)
  maximum-paths ibgp 2
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor iBGP-PG activate
  neighbor iBGP-PG route-reflector-client
  maximum-paths ibgp 2
 exit-address-family
exit
!
end
